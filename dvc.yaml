stages:
  prepare:
    cmd: python src/prepare.py
    deps: [src/prepare.py]
    outs: [data/raw]
  preprocess:
    cmd: python src/preprocess.py
    deps: [src/preprocess.py, data/raw]
    params: [preprocess.test_size, preprocess.seed]
    outs: [data/preprocessed]
  train:
    cmd: python src/train.py
    deps: [src/train.py, data/preprocessed]
    params: [train.dense_units, train.dropout_rate, train.learning_rate,
             train.epochs, train.batch_size, train.seed]
    outs: [models/model.h5, models/history.csv]
  evaluate:
    cmd: python src/evaluate.py
    deps: [src/evaluate.py, models/model.h5, data/preprocessed]
    outs: [reports/confusion_matrix.png]
    metrics:
      - reports/metrics.json:
          cache: false